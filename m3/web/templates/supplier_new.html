{% extends "base.html" %}
{% block title %}Add supplier · M3{% endblock %}
{% block content %}
<h1>Add supplier</h1>
<form method="post" class="panel form-grid cols-2">
  <label class="field"><span>Name</span><input type="text" name="name" required></label>
  <label class="field"><span>Website</span><input type="url" name="website" placeholder="https://"></label>
  <label class="field"><span>Type</span><input type="text" name="supplier_type" placeholder="distributor / wholesaler"></label>
  <label class="field"><span>Categories</span><input type="text" name="product_categories" placeholder="mro, tools"></label>
  <div class="form-actions form-span-all"><button type="submit">Create</button></div>
</form>
{% endblock %}
