{% extends "base.html" %}
{% block title %}Sign in · M3{% endblock %}
{% block content %}
<section class="login-box card stack">
  <h1>Sign in</h1>
  <p class="lead">Use your M3 account. Ask the owner if you need access.</p>
  <form method="post" action="/login" class="stack">
    <label class="field">Email<input type="email" name="email" required autocomplete="username"></label>
    <label class="field">Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
