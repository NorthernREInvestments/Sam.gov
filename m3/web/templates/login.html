{% extends "base.html" %}
{% block title %}Sign in · M3{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="lead">M3 Supply operator workspace. Accounts are invitation-only.</p>
{% if flash %}<div class="flash {{ flash.kind }}">{{ flash.message }}</div>{% endif %}
<form method="post" action="/login" class="panel form-grid cols-2" style="max-width:32rem">
  <label class="field form-span-all"><span>Email</span><input type="email" name="email" required autocomplete="username"></label>
  <label class="field form-span-all"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
  <div class="form-actions form-span-all">
    <button type="submit">Sign in</button>
    <a class="btn secondary" href="/signup">Sign up with invitation</a>
  </div>
</form>
{% endblock %}
