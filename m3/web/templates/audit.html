{% extends "base.html" %}
{% block title %}Audit · M3{% endblock %}
{% block content %}
<h1>Audit history</h1>
<form method="get" class="row">
  <label class="field">User<label><input name="actor" value="{{ actor }}" placeholder="email or system"></label></label>
  <label class="field">Action<input name="action" value="{{ action }}"></label>
  <button type="submit">Filter</button>
</form>
<div class="table-wrap">
<table>
  <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th></tr></thead>
  <tbody>
  {% for e in events %}
  <tr>
    <td>{{ e.at }}</td>
    <td>{{ e.actor_label }}</td>
    <td>{{ e.action }}</td>
    <td>{{ e.entity_type }} {{ e.entity_id }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
